<!doctype html>
<!--
  Ajaxer: a named channel sends through $.ajax to its url and calls back with the JSON, a loader
  appears in the target and the "ajaxer-success" class is set; a url that answers nothing ends in
  "ajaxer-error" with the error shown; two sends within a channel's throttle go once, none when
  the channel's throttle is 0; the durations are the core's. The files beside the page stand for
  the server (a local file answers 200 or 404 to jQuery). Opened by tests/run.mjs in a headless
  browser; the page writes its verdict in #result.
-->
<html>
<head><meta charset="utf-8"><title>ajaxer</title></head>
<body>
<div id="target" style="position: relative; height: 100px"></div>
<div id="box"></div>
<pre id="result">pending</pre>
<script src="jquery.js"></script>
<script src="harness.js"></script>
<script src="../src/js/core.js"></script>
<script src="../src/js/ajaxer.js"></script>
<script>
    (async function () {
        var H = Harness;
        var target = document.getElementById('target');
        H.check(Ajaxer.version === '1.0.56' && Flow.ajaxer === Ajaxer, 'Ajaxer is the core\'s ajaxer module');
        H.check(Ajaxer.parseTime(400) === 400 && Ajaxer.parseTime('250ms') === 250 && Ajaxer.parseTime('1s') === 1000
            && Ajaxer.parseTime('1s, 250ms') === 1000 && Ajaxer.parseTime('250') === 250 && Ajaxer.parseTime(0) === 0
            && Ajaxer.parseTime(undefined) === 0 && Ajaxer.parseTime('abc') === 0, 'a duration is milliseconds, or what its unit says',
            [Ajaxer.parseTime('250ms'), Ajaxer.parseTime('1s')].join());
        H.check(typeof $.fn.serializeObject === 'function', 'serializeObject is installed by the core');

        Ajaxer.ready();
        Ajaxer.setUrl('ping', 'ajaxer-ping.json');
        Ajaxer.setMethod('ping', 'GET');
        Ajaxer.setTarget('ping', target);
        Ajaxer.setLoaderDebounce('ping', 0);

        var answers = [];
        var sent = new Promise(function (resolve) {
            Ajaxer.send('ping', { q: 1 }, function (data) { answers.push(data); resolve(); }, function () { answers.push('error'); resolve(); });
        });
        H.check(target.classList.contains('ajaxer-call'), 'the target is marked while the call is out', target.className);
        await sent;
        await H.after(20);
        H.check(answers.length === 1 && answers[0] && answers[0].pong === true, 'the channel answers with the JSON', JSON.stringify(answers));
        H.check(target.querySelector('.ajaxer-loader') !== null, 'a loader was put in the target');
        H.check(target.classList.contains('ajaxer-success') && !target.classList.contains('ajaxer-call'), 'the target is marked successful afterwards', target.className);

        // The throttle: a second send within the channel's window goes nowhere.
        // The first send above opened the default throttle's window (1s); let it close.
        await H.after(1100);
        Ajaxer.setThrottle('ping', 1000);
        answers = [];
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        await H.until(function () { return answers.length >= 1; }, 3000); await H.after(60);
        H.check(answers.length === 1, 'two sends within the throttle go once', answers.length);
        Ajaxer.setThrottle('ping', 0);
        answers = [];
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        await H.until(function () { return answers.length >= 2; }, 3000); await H.after(60);
        H.check(answers.length === 2, 'with the throttle off both go', answers.length);

        // Durations with a unit: "250ms" is a window of 250 ms (not off), "1s" is one second (not 1 ms).
        Ajaxer.setThrottle('ping', '250ms');
        answers = [];
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        await H.until(function () { return answers.length >= 1; }, 3000); await H.after(60);
        H.check(answers.length === 1, '"250ms" throttles two quick sends to one', answers.length);
        await H.after(300);
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        await H.until(function () { return answers.length >= 2; }, 3000); await H.after(60);
        H.check(answers.length === 2, 'and the window closes after 250 ms', answers.length);
        Ajaxer.setThrottle('ping', '1s');
        await H.after(250);
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        await H.after(150);
        Ajaxer.send('ping', {}, function (data) { answers.push(data); });
        await H.until(function () { return answers.length >= 3; }, 3000); await H.after(60);
        H.check(answers.length === 3, '"1s" holds the window for a second (not 1 ms)', answers.length);
        Ajaxer.setThrottle('ping', 0);

        // A url that answers nothing: the error path, the status shown.
        Ajaxer.setUrl('missing', 'ajaxer-missing.json');
        Ajaxer.setMethod('missing', 'GET');
        Ajaxer.setTarget('missing', target);
        Ajaxer.setRetryLimit('missing', 1);
        Ajaxer.send('missing', {});
        await H.after(400);
        H.check(target.classList.contains('ajaxer-error'), 'a failed call marks the target in error', target.className);
        var status = target.querySelector('.ajaxer-loader .ajaxer-status');
        H.check(status && /404 Error/.test(status.textContent), 'the status is shown in the loader', status && status.textContent);
        // The debounce: sends that follow each other closely go once, the last one's data.
        var api = function (name, query) { Ajaxer.setUrl(name, '/site/api' + (query || '')); Ajaxer.setThrottle(name, 0); Ajaxer.setTarget(name, target); };
        api('typed');
        Ajaxer.setMethod('typed', 'POST');
        Ajaxer.setDebounce('typed', 80);
        answers = [];
        ['r', 'ri', 'rice'].forEach(function (q) { Ajaxer.send('typed', { q: q }, function (data) { answers.push(data); }); });
        await H.after(40);
        H.check(answers.length === 0, 'a debounced channel waits');
        await H.after(250);
        H.check(answers.length === 1 && answers[0].method === 'POST' && JSON.stringify(answers[0].sent) === '[["q","rice"]]', 'then sends once, the last data, by its method', JSON.stringify(answers));

        // The loader: shown once the call has been out for loader_debounce, gone when the answer is in.
        var box = document.getElementById('box');
        api('slow', '?ms=200');
        Ajaxer.setMethod('slow', 'GET');
        Ajaxer.setLoaderContainer('slow', box);
        Ajaxer.setLoaderDebounce('slow', 60);
        Ajaxer.send('slow', {});
        await H.after(30);
        var loader = box.querySelector('.ajaxer-loader');
        H.check(loader && !loader.classList.contains('ajaxer-call'), 'the loader, in its container, waits for loader_debounce', loader && loader.className);
        await H.after(90);
        H.check(loader.classList.contains('ajaxer-call'), 'then shows while the call is out', loader.className);
        await H.after(200);
        H.check(!loader.classList.contains('ajaxer-call') && loader.classList.contains('ajaxer-success'), 'and goes when the answer is in', loader.className);

        // loader_throttle: once shown, the loader stays at least that long (stored and never read up to 1.0.2).
        Ajaxer.setLoaderDebounce('slow', 0);
        Ajaxer.setLoaderThrottle('slow', '600ms');
        Ajaxer.setUrl('slow', '/site/api?ms=60');
        target.classList.remove('ajaxer-success');
        Ajaxer.send('slow', {});
        await H.until(function () { return target.classList.contains('ajaxer-success'); }, 2000);
        H.check(loader.classList.contains('ajaxer-call') && target.classList.contains('ajaxer-success'), 'with loader_throttle the loader outlasts a quick answer', loader.className + ' / ' + target.className);
        await H.after(700);
        H.check(!loader.classList.contains('ajaxer-call'), 'and goes once its time is up', loader.className);
        Ajaxer.setLoaderThrottle('slow', 0);
        target.classList.remove('ajaxer-success');
        Ajaxer.send('slow', {});
        await H.until(function () { return target.classList.contains('ajaxer-success'); }, 2000);
        H.check(!loader.classList.contains('ajaxer-call'), 'without it, the loader goes with the answer', loader.className);

        // query_limit: one call at a time. Not cancelable, the newcomer is refused; cancelable, the one in flight is aborted.
        api('one', '?ms=150');
        Ajaxer.setMethod('one', 'GET');
        Ajaxer.setQueryLimit('one', 1);
        answers = [];
        Ajaxer.send('one', { n: 1 }, function (data) { answers.push(data.sent[1][1]); });
        Ajaxer.send('one', { n: 2 }, function (data) { answers.push(data.sent[1][1]); });
        await H.after(350);
        H.check(answers.join() === '1', 'past its query_limit a channel refuses the newcomer', answers.join());
        Ajaxer.cancelable('one');
        answers = [];
        Ajaxer.send('one', { n: 1 }, function (data) { answers.push(data.sent[1][1]); });
        Ajaxer.send('one', { n: 2 }, function (data) { answers.push(data.sent[1][1]); });
        await H.after(350);
        H.check(answers.join() === '2', 'cancelable, it aborts the one in flight for the newcomer', answers.join());
        Ajaxer.send('one', { n: 3 }, function (data) { answers.push(data.sent[1][1]); });
        Ajaxer.abort('one');
        await H.after(300);
        H.check(answers.join() === '2', 'Ajaxer.abort() drops the calls of a channel', answers.join());

        // A failure with its reason: the status and the server's "response" in the loader, the target in error.
        Harness.expect(/500/);
        api('refused', '?fail=500');
        Ajaxer.setMethod('refused', 'GET');
        Ajaxer.setRetryLimit('refused', 1);
        var completed = 0;
        Ajaxer.send('refused', {}, function () {}, function () {}, function () { completed++; });
        await H.after(300);
        status = target.querySelector('.ajaxer-loader .ajaxer-status');
        H.check(/500 Error: refused/.test(status.textContent) && target.classList.contains('ajaxer-error') && completed === 1, 'a failure shows its status and reason, and completes', status.textContent + ' ' + completed);
        H.check(Ajaxer.getTarget('refused') === target && Ajaxer.get('url[refused]') === '/site/api?fail=500' && Ajaxer.xhr === Ajaxer.send, 'the channel\'s settings read back');
        H.done();
    })().catch(function (e) { Harness.check(false, 'run', e && e.stack || e); Harness.done(); });
</script>
</body>
</html>
