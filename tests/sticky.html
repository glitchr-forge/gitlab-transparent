<!doctype html>
<!--
  Sticky: the address follows the headline being read (.sticky-headlines[id], the "highlight" class);
  a block fades in (.sticky-easein) as it comes near; Sticky.scrollTo moves the page through the core's
  engine and the scroll is a script's meanwhile (userScroll false); the scroll is computed once per
  frame through the core, bound once however many times the page is (re)loaded. Not asserted, kept as
  1.7.0 ships them: the hiding header (.sticky-top: every scroll writes aria-scrollhide="false" on it
  first, which turns the effect off) and the magnets (getMagnets() reads offsetTop off `this` in an
  Array.map callback, NaN, so the nearest magnet is always the first). Opened by tests/run.mjs
  in a headless browser; the page writes its verdict in #result.
-->
<html>
<head>
<meta charset="utf-8"><title>sticky</title>
<style>
    html { scroll-behavior: auto; scroll-padding-top: 0; }
    body { margin: 0; }
    .sticky-top { position: sticky; top: 0; height: 80px; background: #ddd; }
    section { height: 100vh; }
    #result { position: fixed; bottom: 0; left: 0; margin: 0; }
</style>
</head>
<body>
<header id="header" class="sticky sticky-top"></header>
<button id="first" class="sticky-magnet-first bottom-right">first</button>
<section id="one" class="sticky-headlines sticky-magnet">One</section>
<section id="two" class="sticky-headlines sticky-magnet">Two</section>
<section id="three" class="sticky-headlines">Three <div id="fade" class="sticky sticky-easein" data-sticky-easein="0" style="height: 40px">fade</div></section>
<section id="four" class="sticky-headlines">Four</section>
<div id="inner" style="overflow-y: scroll; height: 60px; scroll-padding-top: 12px"><div style="height: 300px"></div></div>
<div id="auto" style="overflow: auto; height: 60px; width: 100px"><div style="height: 300px"></div></div>
<pre id="result">pending</pre>
<script src="jquery.js"></script>
<script src="harness.js"></script>
<script src="../src/js/core.js"></script>
<script src="../src/js/sticky.js"></script>
<script>
    (async function () {
        var H = Harness;
        var header = document.getElementById('header');
        var computed = 0;
        var compute = Sticky.compute;
        Sticky.compute = function () { computed++; return compute.apply(this, arguments); };
        var top = function (id) { return Math.round(document.getElementById(id).getBoundingClientRect().top + window.scrollY); };

        Sticky.ready({ scrollsnap: false, autoscroll: false, swipehint: false });
        await H.after(20); // onLoad binds a tick after DOMContentLoaded
        await H.frame();
        H.check(Sticky.version === '1.7.0' && Flow.sticky === Sticky, 'Sticky is the core\'s sticky module');
        // Sticky.scrollTo: the core's engine, the scroll a script's meanwhile.
        var called = false;
        Sticky.scrollTo({ top: 200, duration: '80ms' }, function () { called = true; });
        H.check(Sticky.userScroll() === false && Flow.scripted(window), 'while Sticky scrolls, the scroll is a script\'s');
        await H.until(function () { return called; }, 600);
        H.check(called && Math.round(window.scrollY) === 200 && Sticky.userScroll() === true, 'Sticky.scrollTo arrives, calls back and gives the scroll back', window.scrollY + ' ' + called);
        H.scroll(0);
        await H.frame();

        // The hiding header (.sticky-top): gone as the page goes down, back on the way up. Up to 1.0.2 every
        // scroll wrote aria-scrollhide="false" on it first and it never hid.
        await H.after(600); // the scroll at rest: the next event starts a gesture
        H.scroll(300); await H.frame();
        H.scroll(400); await H.frame();
        H.check(header.getAttribute('aria-scrollhide') === null, 'the library leaves aria-scrollhide to the page', header.getAttribute('aria-scrollhide'));
        H.check(!header.classList.contains('show') && parseFloat(header.style.top) <= -header.clientHeight, 'the header hides as the page scrolls down', header.className + ' top ' + header.style.top);
        H.scroll(350); await H.frame();
        H.check(header.classList.contains('show') && header.style.top === '', 'and shows again on the way up', header.className + ' top ' + header.style.top);
        H.scroll(450); await H.frame();
        H.check(!header.classList.contains('show'), 'hidden again going down');
        await H.after(600); // at rest, hidden: the first event of the next gesture tells no direction
        H.scroll(500); await H.frame();
        H.check(!header.classList.contains('show'), 'a header hidden stays hidden when the scroll takes up again downwards', header.className);
        header.setAttribute('aria-scrollhide', 'false');
        H.scroll(200); await H.frame();
        H.scroll(100); await H.frame();
        H.check(header.classList.contains('show'), 'up: shown');
        H.scroll(500); await H.frame();
        H.scroll(600); await H.frame();
        H.check(header.classList.contains('show'), 'aria-scrollhide="false" keeps the header', header.className);
        header.removeAttribute('aria-scrollhide');
        Sticky.set('scrollhide', false);
        H.scroll(700); await H.frame();
        H.check(header.classList.contains('show'), 'and so does the scrollhide option set to false', header.className);
        Sticky.set('scrollhide', true);
        H.scroll(0);
        await H.frame();
        await H.after(600);

        // The magnets (.sticky-magnet): each one's own place, top to bottom. getMagnets() read them off `this` in an
        // Array.map callback - the window - and every magnet came back as {element: window, offsetTop: undefined}.
        var magnets = Sticky.getMagnets(document.documentElement);
        H.check(magnets.length === 2 && magnets[0].element === document.getElementById('one') && magnets[1].element === document.getElementById('two'), 'getMagnets() gives the magnets themselves', magnets.map(function (m) { return m.element && m.element.id; }).join());
        H.check(magnets[0].offsetTop === document.getElementById('one').offsetTop && magnets[1].offsetTop === document.getElementById('two').offsetTop, 'with their own offsetTop', magnets.map(function (m) { return m.offsetTop; }).join());
        H.check(magnets[0].visible > 0 && magnets[0].visible <= 1 && magnets[1].visible >= 0, 'and the share of the screen they fill', magnets.map(function (m) { return m.visible; }).join());
        H.check(Sticky.getNextSnap(document.documentElement).element === document.getElementById('two') && Sticky.getFirstSnap(document.documentElement).element === document.getElementById('one'), 'the next and the first snap are magnets');
        H.scroll(top('two')); await H.frame();
        H.check(document.getElementById('first').classList.contains('show'), 'past the first magnet, .sticky-magnet-first shows', document.getElementById('first').className);
        H.scroll(0); await H.frame();
        H.check(!document.getElementById('first').classList.contains('show'), 'and not at the first one');

        // A jQuery object where an element is meant (the module hands itself some): an inner scroller's own flag and padding.
        var inner = document.getElementById('inner');
        $(inner).prop('user-scroll', false);
        H.check(Sticky.userScroll($(inner)) === false && Sticky.userScroll(inner) === false && Sticky.userScroll($(inner).children()) === false, 'Sticky.userScroll reads the scroller of a jQuery object', Sticky.userScroll($(inner)));
        H.check(Sticky.userScroll() === true && Sticky.userScroll($('#nothing-there')) === true, 'the page\'s own flag is untouched');
        $(inner).prop('user-scroll', true);
        H.check(Sticky.getScrollPadding($(inner)).top === 12 && Sticky.getScrollPadding(inner.firstElementChild).top === 12 && Sticky.getScrollPadding('#inner').top === 12, 'Sticky.getScrollPadding reads it too', Sticky.getScrollPadding($(inner)).top);
        var detached = document.createElement('div');
        H.check($(detached).closestScrollable().length === 0 && Sticky.userScroll(detached) === true, 'an element out of the page has no scroller');
        var auto = document.getElementById('auto');
        H.check($(auto).isScrollableY()[0] === true && $(auto).isScrollableX()[0] === false && $(auto).isScrollable() === true, 'overflow: auto scrolls for isScrollableX/Y as for isScrollable', $(auto).isScrollableY()[0] + ' ' + $(auto).isScrollableX()[0]);

        // The headline being read: reached where its own link lands it.
        H.scroll(top('two') + 10);
        await H.frame();
        H.check(document.getElementById('two').classList.contains('highlight'), 'the headline reached is highlighted', document.querySelector('.highlight') && document.querySelector('.highlight').id);
        var fade = document.getElementById('fade');
        H.check(!fade.classList.contains('show'), 'a block far below is not shown yet', fade.className);
        H.scroll(top('three'));
        await H.frame();
        H.check(fade.classList.contains('show'), 'a block fades in as it comes into view', fade.className);
        H.check(document.getElementById('three').classList.contains('highlight') && !document.getElementById('two').classList.contains('highlight'), 'the highlight moves to the next headline');

        // One compute per frame in which the page scrolled: three scrolls in one frame, one compute.
        computed = 0;
        H.scroll(100); H.scroll(200); H.scroll(300);
        await H.frame();
        H.check(computed === 1, 'the scroll event is computed once per frame', computed);

        // The page loaded again (the navigation re-dispatches DOMContentLoaded): bound once, not added to.
        window.dispatchEvent(new Event('DOMContentLoaded'));
        window.dispatchEvent(new Event('DOMContentLoaded'));
        await H.after(20);
        computed = 0;
        H.scroll(350);
        await H.frame();
        H.check(computed === 1, 'a page loaded again does not add handlers', computed);
        var l = H.listeners(/^window scroll$/);
        H.check(l['window scroll'] === 1, 'one native scroll listener on the window', JSON.stringify(H.listeners(/scroll|wheel|touch|mousedown/)));

        // The address: replacehash writes the headline's id (a file: document may refuse replaceState; then only the highlight counts).
        H.scroll(top('four') + 10);
        await H.frame();
        H.note('hash ' + (location.hash || '(none)') + ', highlight ' + (document.querySelector('.highlight') || {}).id);
        H.done();
    })().catch(function (e) { Harness.check(false, 'run', e && e.stack || e); Harness.done(); });
</script>
</body>
</html>
